server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/impotfacile?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — override JWT_SECRET et APP_ENCRYPTION_KEY en production
jwt.secret=${JWT_SECRET:impotfacile-2026-super-secret-key-required-32-bytes-minimum!}
jwt.expiration=86400000
jwt.issuer=impotfacile

# Chiffrement AES-256 (GCM) des donnees sensibles (donneesFormulaire)
# Cle de dev (base64, 32 octets) — a remplacer via APP_ENCRYPTION_KEY en production
app.encryption.key=${APP_ENCRYPTION_KEY:8qEzHxrYddOlPSVtRVL9zr/hcaedLBcYJYnBTa9vDKE=}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (origines separees par des virgules)
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
